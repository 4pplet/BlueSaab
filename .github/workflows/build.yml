name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the GCC 8 era verified locally (docs/BUILD_v6.md) — newer
      # majors are untested against the vendored mbed OS 2 sources.
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '8-2019-q3'

      - name: Build
        run: make

      - name: Size
        run: arm-none-eabi-size BUILD/BlueSaab.elf

      - uses: actions/upload-artifact@v4
        with:
          name: BlueSaab-firmware
          path: |
            BUILD/BlueSaab.bin
            BUILD/BlueSaab.hex
            BUILD/BlueSaab.elf

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scroller + utf_convert unit tests on the host, in both char
      # signednesses (the target builds with -funsigned-char).
      - name: Build and run host tests
        run: |
          g++ -funsigned-char -I test/stubs -I . test/host_tests.cpp Scroller.cpp utf_convert.cpp -o host_tests_u
          ./host_tests_u
          g++ -fsigned-char -I test/stubs -I . test/host_tests.cpp Scroller.cpp utf_convert.cpp -o host_tests_s
          ./host_tests_s
